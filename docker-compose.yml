version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: portfolio-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      CLIENT_URL: http://localhost:5173
      MONGO_URI: mongodb://mongo:27017/portfolio_platform
      JWT_ACCESS_SECRET: change_this_access_secret_in_production
      JWT_REFRESH_SECRET: change_this_refresh_secret_in_production
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      COOKIE_SECRET: change_this_cookie_secret
      SEED_ADMIN_EMAIL: admin@portfolio.dev
      SEED_ADMIN_PASSWORD: Admin@12345
    volumes:
      - api-uploads:/app/uploads
      - api-logs:/app/logs
    # Seed on first boot, then start the server.
    command: sh -c "node src/database/seed.js || true && node src/server.js"

volumes:
  mongo-data:
  api-uploads:
  api-logs:
